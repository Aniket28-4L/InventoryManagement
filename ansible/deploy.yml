---
- name: Deploy Inventory Management Application
  hosts: webservers
  become: yes

  vars:
    project_root: /opt/inventory-management
    repo_url: git@github.com:Aniket28-4L/InventoryManagement.git
    repo_branch: DevContainer
    dockerhub_username: "{{ lookup('env', 'DOCKERHUB_USERNAME') }}"
    dockerhub_token: "{{ lookup('env', 'DOCKERHUB_TOKEN') }}"
    server_ip: "{{ ansible_host | default('localhost') }}"

  tasks:
    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
          - git
        state: present
        update_cache: yes

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: Install Docker and Docker Compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create project directory with correct ownership
      file:
        path: /opt/inventory-management
        state: directory
        owner: aniket
        group: aniket
        mode: '0755'


    - name: Clone / Update application repository
      become: false
      git:
        repo: git@github.com:Aniket28-4L/InventoryManagement.git
        dest: /opt/inventory-management
        version: DevContainer
        update: yes
        force: yes
        accept_hostkey: yes


    - name: Fix ownership of project directory
      file:
        path: "{{ project_root }}"
        owner: aniket
        group: aniket
        recurse: yes

    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_token }}"
        reauthorize: yes

    - name: Pull latest Docker images
      command: docker compose pull
      args:
        chdir: "{{ project_root }}"

    - name: Stop existing containers
      command: docker compose down
      args:
        chdir: "{{ project_root }}"
      ignore_errors: yes

    - name: Start application containers
      command: docker compose up -d
      args:
        chdir: "{{ project_root }}"

    - name: Prune unused Docker images
      command: docker image prune -f
