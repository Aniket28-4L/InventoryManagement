---
- name: Deploy Inventory Management Application
  hosts: webservers
  become: yes

  vars:
    dockerhub_username: "{{ lookup('env', 'DOCKERHUB_USERNAME') }}"
    dockerhub_token: "{{ lookup('env', 'DOCKERHUB_TOKEN') }}"
    project_root: /opt/inventory-management
    server_ip: "{{ ansible_host }}"

  tasks:
    - name: Update apt cache and install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
        state: present
        update_cache: yes

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: Install Docker and Docker Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Install Docker SDK for Python (required for Ansible docker modules)
      pip:
        name: docker

    - name: Add Ansible user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Create project directory
      file:
        path: "{{ project_root }}"
        state: directory
        mode: '0755'

    - name: Copy production docker-compose file
      copy:
        src: docker-compose.yml
        dest: "{{ project_root }}/docker-compose.yml"

    - name: Login to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_token }}"
        reauthorize: yes

    - name: Pull latest Docker images
      command: docker compose pull
      args:
        chdir: "{{ project_root }}"

    - name: Stop existing containers
      command: docker compose down
      args:
        chdir: "{{ project_root }}"
      environment:
        SERVER_IP: "{{ server_ip }}"

    - name: Start application containers
      command: docker compose up -d
      args:
        chdir: "{{ project_root }}"
      environment:
        SERVER_IP: "{{ server_ip }}"

    - name: Remove unused Docker images
      command: docker image prune -f
