services:
  frontend:
    image: annyket08/inventory-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    image: annyket08/inventory-backend:latest
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/inventory
      - NODE_ENV=production
      - ALLOW_ORIGIN=http://YOUR_APP_PUBLIC_IP
    depends_on:
      - mongodb

  mongodb:
    image: mongo:6
    container_name: inventory-management-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data: